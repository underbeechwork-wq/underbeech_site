<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>アンダービーチ｜角の形を比較</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:#183e2f;background:#e9eeeb}body{display:grid;grid-template-rows:auto minmax(0,1fr)}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 22px;background:#fff;border-bottom:1px solid #bdccc1;box-shadow:0 2px 8px #183e2f0d;z-index:2}.heading{margin-right:auto}.heading strong{display:block;font-size:16px}.heading small{display:block;font-size:12px;color:#63776a;margin-top:4px}.group{display:flex;gap:5px}.bar button{font:inherit;font-weight:700;font-size:14px;padding:10px 14px;border:1px solid #b9c9bf;background:#fff;color:#224e37;cursor:pointer;border-radius:0;white-space:nowrap}.bar button[aria-pressed=true]{background:#174735;border-color:#174735;color:white}.bar button:focus-visible{outline:3px solid #e3ab38;outline-offset:2px}.jump{font:inherit;font-size:14px;padding:10px;border:1px solid #b9c9bf;background:#fff;color:#224e37}.stage{overflow:hidden;display:flex;justify-content:center;min-height:0;padding:0;transition:padding .2s}.stage.mobile{padding:12px}iframe{border:0;background:#fff;width:100%;height:100%;display:block;box-shadow:0 3px 22px #102e221a}.stage.mobile iframe{width:390px;max-width:100%}@media(max-width:650px){.bar{padding:10px;gap:8px}.heading{width:100%}.bar button{padding:8px 10px;font-size:13px}.jump{font-size:13px;padding:8px}.heading small{font-size:12px}}
</style></head><body>
<header class="bar">
<div class="heading"><strong>アンダービーチ｜角の見た目を比較</strong><small>正方形・高さが低い横長のUIだけ角丸にした版を追加</small></div>
<div class="group" role="group" aria-label="角の形"><button type="button" data-shape="rounded" aria-pressed="false">現在の角丸あり</button><button type="button" data-shape="square" aria-pressed="false">角丸なし</button><button type="button" data-shape="mixed" aria-pressed="true">一部だけ角丸</button></div>
<div class="group" role="group" aria-label="表示幅"><button type="button" data-width="desktop" aria-pressed="true">パソコン幅</button><button type="button" data-width="mobile" aria-pressed="false">スマホ幅</button></div>
<select class="jump" aria-label="確認する場所"><option value="top">ページ上部</option><option value="price">料金の目安</option><option value="service">作業内容</option><option value="contact">お問い合わせ・SNS</option></select>
</header>
<main class="stage"><iframe src="./" title="アンダービーチの比較用プレビュー"></iframe></main>
<script>
(()=>{
let mode='mixed';
const frame=document.querySelector('iframe'),stage=document.querySelector('.stage');
const resetCSS=`
html.corner-preview-measuring *,html.corner-preview-measuring *::before,html.corner-preview-measuring *::after{transition:none!important}
html.corner-preview-square *,html.corner-preview-square *::before,html.corner-preview-square *::after,
html.corner-preview-mixed *,html.corner-preview-mixed *::before,html.corner-preview-mixed *::after{border-radius:0!important}
html.corner-preview-mixed [data-corner-round]{border-radius:var(--corner-radius)!important}
html.corner-preview-mixed [data-corner-round-before]::before{border-radius:var(--corner-radius-before)!important}
html.corner-preview-mixed [data-corner-round-after]::after{border-radius:var(--corner-radius-after)!important}
`;
let observer=null,resizeWindow=null,tick=0;
function wanted(width,height){
if(width<=0||height<=0)return false;
const ratio=width/height;
return (ratio>=.9&&ratio<=1.1)||(height<=80&&ratio>=1.5);
}
function hasRadius(radius){return radius.split(/[\s/]+/).some(value=>parseFloat(value)>0)}
function apply(){
try{
const doc=frame.contentDocument;if(!doc||!doc.head||!doc.body)return;
let style=doc.getElementById('corner-preview-override');
if(!style){style=doc.createElement('style');style.id='corner-preview-override';doc.head.appendChild(style)}
if(style.textContent!==resetCSS)style.textContent=resetCSS;
const root=doc.documentElement;
root.classList.add('corner-preview-measuring');
root.classList.remove('corner-preview-square','corner-preview-mixed');
doc.querySelectorAll('[data-corner-round],[data-corner-round-before],[data-corner-round-after]').forEach(el=>{
el.removeAttribute('data-corner-round');el.removeAttribute('data-corner-round-before');el.removeAttribute('data-corner-round-after');
});
if(mode==='mixed'){
const keep=[];
doc.body.querySelectorAll('*').forEach(el=>{
const rect=el.getBoundingClientRect();
if(!rect.width||!rect.height)return;
const css=frame.contentWindow.getComputedStyle(el);
if(hasRadius(css.borderRadius)&&wanted(rect.width,rect.height))keep.push({el,suffix:'',radius:css.borderRadius});
['before','after'].forEach(pseudo=>{
const p=frame.contentWindow.getComputedStyle(el,'::'+pseudo);
if(p.content==='none'||p.content==='normal'||!hasRadius(p.borderRadius))return;
const width=parseFloat(p.width),height=parseFloat(p.height);
if(wanted(width,height))keep.push({el,suffix:'-'+pseudo,radius:p.borderRadius});
});
});
keep.forEach(({el,suffix,radius})=>{el.style.setProperty('--corner-radius'+suffix,radius);el.setAttribute('data-corner-round'+suffix,'')});
root.classList.add('corner-preview-mixed');
}else if(mode==='square')root.classList.add('corner-preview-square');
root.classList.remove('corner-preview-measuring');
}catch(error){console.warn('このページには比較表示を適用できませんでした。')}
}
function schedule(){cancelAnimationFrame(tick);tick=requestAnimationFrame(apply)}
function bind(){
if(observer)observer.disconnect();
if(resizeWindow)resizeWindow.removeEventListener('resize',schedule);
apply();
try{
resizeWindow=frame.contentWindow;resizeWindow.addEventListener('resize',schedule);
observer=new MutationObserver(schedule);observer.observe(frame.contentDocument.body,{childList:true,subtree:true});
}catch(error){}
}
document.querySelectorAll('[data-shape]').forEach(button=>button.addEventListener('click',()=>{
mode=button.dataset.shape;document.querySelectorAll('[data-shape]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));apply();
}));
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{
stage.classList.toggle('mobile',button.dataset.width==='mobile');document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));schedule();
}));
frame.addEventListener('load',bind);
document.querySelector('.jump').addEventListener('change',e=>{
const doc=frame.contentDocument,id=e.target.value;
if(id==='top')frame.contentWindow.scrollTo({top:0,behavior:'instant'});
else{const el=doc.getElementById(id);if(el)el.scrollIntoView({behavior:'instant',block:'start'});else frame.src='./#'+encodeURIComponent(id);}
});
bind();
})();
</script></body></html>
