<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>アンダービーチ｜角丸あり・なし比較</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;color:#183e2f;background:#e9eeeb}body{display:grid;grid-template-rows:auto minmax(0,1fr)}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 22px;background:#fff;border-bottom:1px solid #bdccc1;box-shadow:0 2px 8px #183e2f0d;z-index:2}.heading{margin-right:auto}.heading strong{display:block;font-size:16px}.heading small{display:block;font-size:12px;color:#63776a;margin-top:4px}.group{display:flex;gap:5px}.bar button{font:inherit;font-weight:700;font-size:14px;padding:10px 14px;border:1px solid #b9c9bf;background:#fff;color:#224e37;cursor:pointer;border-radius:0;white-space:nowrap}.bar button[aria-pressed=true]{background:#174735;border-color:#174735;color:white}.bar button:focus-visible{outline:3px solid #e3ab38;outline-offset:2px}.jump{font:inherit;font-size:14px;padding:10px;border:1px solid #b9c9bf;background:#fff;color:#224e37}.stage{overflow:hidden;display:flex;justify-content:center;min-height:0;padding:0;transition:padding .2s}.stage.mobile{padding:12px}iframe{border:0;background:#fff;width:100%;height:100%;display:block;box-shadow:0 3px 22px #102e221a}.stage.mobile iframe{width:390px;max-width:100%}@media(max-width:650px){.bar{padding:10px;gap:8px}.heading{width:100%}.bar button{padding:8px 10px;font-size:13px}.jump{font-size:13px;padding:8px}.heading small{font-size:12px}}
</style></head><body>
<header class="bar">
<div class="heading"><strong>アンダービーチ｜角の見た目を比較</strong><small>比較用プレビュー・色や配置はそのまま</small></div>
<div class="group" role="group" aria-label="角の形"><button type="button" data-shape="rounded" aria-pressed="false">現在の角丸あり</button><button type="button" data-shape="square" aria-pressed="true">角丸なし</button></div>
<div class="group" role="group" aria-label="表示幅"><button type="button" data-width="desktop" aria-pressed="true">パソコン幅</button><button type="button" data-width="mobile" aria-pressed="false">スマホ幅</button></div>
<select class="jump" aria-label="確認する場所"><option value="top">ページ上部</option><option value="price">料金の目安</option><option value="service">作業内容</option><option value="contact">お問い合わせ・SNS</option></select>
</header>
<main class="stage"><iframe src="./" title="アンダービーチの比較用プレビュー"></iframe></main>
<script>
(()=>{
let square=true;
const frame=document.querySelector('iframe'),stage=document.querySelector('.stage');
const resetCSS='html.corner-preview-square *,html.corner-preview-square *::before,html.corner-preview-square *::after{border-radius:0!important;border-start-start-radius:0!important;border-start-end-radius:0!important;border-end-start-radius:0!important;border-end-end-radius:0!important}';
function apply(){
try{
const doc=frame.contentDocument;if(!doc||!doc.head)return;
let style=doc.getElementById('corner-preview-override');
if(!style){style=doc.createElement('style');style.id='corner-preview-override';style.textContent=resetCSS;doc.head.appendChild(style)}
doc.documentElement.classList.toggle('corner-preview-square',square);
}catch(error){console.warn('このページには比較表示を適用できませんでした。')}
}
document.querySelectorAll('[data-shape]').forEach(button=>button.addEventListener('click',()=>{square=button.dataset.shape==='square';document.querySelectorAll('[data-shape]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));apply()}));
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{stage.classList.toggle('mobile',button.dataset.width==='mobile');document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)))}));
frame.addEventListener('load',apply);
document.querySelector('.jump').addEventListener('change',e=>{
const doc=frame.contentDocument,id=e.target.value;
if(id==='top')frame.contentWindow.scrollTo({top:0,behavior:'instant'});
else{const el=doc.getElementById(id);if(el)el.scrollIntoView({behavior:'instant',block:'start'});else frame.src='./#'+encodeURIComponent(id);}
});
apply();
})();
</script></body></html>
